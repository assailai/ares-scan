# Proves the published action actually runs as an action: GitHub resolves action.yml, maps the
# inputs to INPUT_*, executes dist/index.cjs on node20, and the exit code reaches the job.
#
# A stub stands in for Ares so this needs no credentials and no network beyond localhost. It is
# deleted once it has answered the only question it exists to answer.
name: self-test

on:
  workflow_dispatch:

jobs:
  gate-fails-the-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stand up a stub Ares
        run: |
          node -e '
            const { createServer } = require("node:http");
            const counts = { critical: 2, high: 0, medium: 0, low: 0, info: 0 };
            createServer((req, res) => {
              const send = (code, body) => {
                res.writeHead(code, { "content-type": "application/json" });
                res.end(JSON.stringify(body));
              };
              if (req.method === "POST") return send(201, {
                id: "1", status: "queued", target_id: "t", target_name: "stub",
                target_url: "https://app.example", url_overridden: true, hunt_type: "web",
                profile_id: "p", timeout_minutes: 5, poll_url: "/api/v1/ci/runs/1",
                dashboard_url: "https://ares.example/hunts/1", started_at: null,
              });
              send(200, {
                id: "1", status: "completed", is_terminal: true, current_phase: null,
                target_id: "t", target_name: "stub", target_url: "https://app.example",
                url_overridden: true, failure_reason: null,
                detected: counts, detected_total: 2, counted_basis: "open",
                gate: { verdict: "failed", counts, total: 2, counted: "open",
                        triggered: [{ rule: { metric: "critical", comparator: "gt", threshold: 0 }, observed: 2 }],
                        summary: "Quality gate failed: critical > 0 (found 2) (counting open findings only)." },
                dashboard_url: "https://ares.example/hunts/1", report_id: null,
              });
            }).listen(8799, () => console.log("stub up"));
          ' &
          sleep 1

      - name: Run the action, expecting it to fail the build
        id: scan
        continue-on-error: true
        uses: assailai/ares-scan@v1
        with:
          api-key: stub-key
          ares-url: http://127.0.0.1:8799
          profile: 9f3c8a12-0000-0000-0000-000000000000
          preview-url: https://pr-1.preview.example.com
          fail-on: "critical>0,high>0"
          poll-seconds: "1"

      - name: The step must have failed, and its outputs must be populated
        run: |
          echo "outcome:  ${{ steps.scan.outcome }}   (want failure)"
          echo "verdict:  ${{ steps.scan.outputs.verdict }}   (want failed)"
          echo "critical: ${{ steps.scan.outputs.critical-count }}   (want 2)"
          echo "run-id:   ${{ steps.scan.outputs.run-id }}"
          [ "${{ steps.scan.outcome }}" = "failure" ]
          [ "${{ steps.scan.outputs.verdict }}" = "failed" ]
          [ "${{ steps.scan.outputs.critical-count }}" = "2" ]

      - name: The job summary must have been written
        run: |
          test -s "$GITHUB_STEP_SUMMARY" && echo "job summary written"
